name: gena
description: "Gena AI"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_gemma: ^0.16.2
  drift: ^2.30.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  go_router: ^17.2.3
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  get_it: ^8.2.0
  flutter_dotenv: ^6.0.1
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  ddgs: ^0.3.2
  html2md: ^1.3.2
  flutter_inappwebview: ^6.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  logger: ^2.7.0
  gpt_markdown: ^1.1.7
  shared_preferences: ^2.5.5
  flutter_highlight: ^0.7.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.2
  fluttertoast: ^9.0.0
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.7
  hugeicons: ^1.1.7
  fullscreen_image_viewer: ^1.2.0
  doc_text_extractor: ^2.1.0
  url_launcher: ^6.3.2
  contacts_service_plus: ^0.0.3
  flutter_sms: ^3.0.1
  torch_light: ^1.1.0
  openai_dart: ^5.0.0
  genkit: ^0.13.0
  genkit_openai: ^0.3.2
  genkit_flutter_gemma: ^0.3.1
  llamadart: ^0.8.1
  genkit_llamadart: ^1.3.3
  llamadart_llama_cpp_flutter: ^0.0.1
  llamadart_litert_lm_flutter: ^0.0.2
  schemantic: ^0.1.3
  background_downloader: ^9.5.5
  dio: ^5.9.0
  introduction_screen: ^4.0.0
  mobile_rag_engine: ^0.18.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.30.1
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.13.2

dependency_overrides:
  flutter_gemma: ^0.16.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/  # JSON data file
    - assets/images/  # JSON data file
    # Workspace RAG embedding model + tokenizer for mobile_rag_engine.
    # Source: sentence-transformers/all-MiniLM-L6-v2 (the model recommended by
    # the mobile_rag_engine README).
    #   model.onnx  <- onnx/model_qint8_arm64.onnx (INT8 quantized, ~23MB)
    #     https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model_qint8_arm64.onnx
    #     sha256: 4278337fd0ff3c68bfb6291042cad8ab363e1d9fbc43dcb499fe91c871902474
    #   tokenizer.json
    #     https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json
    #     sha256: be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037
    - assets/rag/
