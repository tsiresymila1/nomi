name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # The app declares .env as an asset; create an empty one so the test
      # asset bundle builds. Real secrets are never required for analyze/test.
      - name: Create placeholder .env
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      # Scope to lib/test: the repo vendors an unrelated `smart_background_tasks`
      # package that would add noise to a project-wide analyze.
      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test
