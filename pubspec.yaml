name: gena
description: "Gena AI"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.30.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  go_router: ^17.2.3
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  get_it: ^8.2.0
  flutter_dotenv: ^6.0.1
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  ddgs: ^0.3.2
  html2md: ^1.3.2
  flutter_inappwebview: ^6.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  logger: ^2.7.0
  gpt_markdown: ^1.1.7
  shared_preferences: ^2.5.5
  flutter_highlight: ^0.7.0
  flutter_animate: ^4.5.2
  fluttertoast: ^9.0.0
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.7
  hugeicons: ^1.1.7
  fullscreen_image_viewer: ^1.2.0
  doc_text_extractor: ^2.1.0
  url_launcher: ^6.3.2
  contacts_service_plus: ^0.0.3
  flutter_sms: ^3.0.1
  torch_light: ^1.1.0
  openai_dart: ^5.0.0
  genkit: ^0.13.0
  genkit_openai: ^0.3.2
  llamadart: 0.11.0
  genkit_llamadart: 1.4.0
  llamadart_llama_cpp_flutter: ^0.0.21
  llamadart_litert_lm_flutter: ^0.0.13
  llamadart_stable_diffusion_flutter: ^0.0.2
  schemantic: ^0.1.3
  background_downloader: ^9.5.5
  dio: ^5.9.0
  introduction_screen: ^4.0.0
  mobile_rag_engine: ^0.18.6
  # mobile_rag_engine 0.18.6 ships FFI bindings generated by exactly 2.11.1.
  # The bridge rejects even a minor runtime mismatch during initialization.
  flutter_rust_bridge: 2.11.1
  crypto: ^3.0.6
  whisper_ggml_plus: ^1.5.2
  record: ^6.2.1
  flutter_tts: ^4.2.5
  mcp_dart: ^2.2.1
  vad: ^0.0.8

# genkit_llamadart 1.4.0 still declares llamadart ^0.8.0 even though the chat
# APIs used by this app remain source-compatible with 0.11.0. Keep this narrow
# override until the bridge publishes a release whose constraint includes the
# image-generation runtime.
dependency_overrides:
  llamadart: 0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.30.1
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.13.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/  # JSON data file
    - assets/images/  # JSON data file
    # Bundled Silero v5 VAD model for hands-free voice mode. Loaded offline via
    # baseAssetPath ('assets/vad/') by VadSpeechSegmenter; source/SHA-256 pinned
    # in that file's header so VAD works without a network round-trip.
    - assets/vad/
    # Workspace RAG embedding model + tokenizer are NOT bundled. They are
    # downloaded once on first RAG use into the app documents directory by
    # RagModelProvisioner (see rag_model_provisioner.dart), keeping the app
    # bundle and git repo small. Source/SHA-256 are pinned in that file.

hooks:
  user_defines:
    llamadart:
      # Android-first build: GGUF chat, optional LiteRT chat, and the explicit
      # stable-diffusion.cpp image composer. Image weights are downloaded on
      # demand and are never bundled in the APK.
      llamadart_native_runtimes:
        runtimes: [llama_cpp, litert_lm, stable_diffusion]
        platforms:
          ios-x86_64-sim: [llama_cpp, stable_diffusion]
          windows-arm64: [llama_cpp]
